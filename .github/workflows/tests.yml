# Testes automaticos a cada push / pull request.
# A suite do lado ArcMap (Python 2.7 + arcpy/ArcObjects) exige ArcGIS Desktop e roda localmente
# com run_tests.bat; os testes de interface do QMagery exigem o PyQGIS e rodam com o python-qgis do QGIS.
# Aqui, testes que dependem de GDAL/QGIS sao pulados automaticamente.
name: Testes

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias do backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Consistencia de versao (config.xml, gee_gui, gee_updater, README e metadata do QMagery)
        run: python tools/check_versions.py

      - name: Suite do backend
        run: python tests/backend/run_all.py -v

  # Plugin do QGIS (QMagery): contrato com o backend, paridade com o ArcMagery e empacotamento.
  qmagery:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias do backend (o QMagery usa o mesmo backend)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Suite do QMagery
        run: python tests/qgis/run_all.py

  # Job sentinela: falha se qualquer job acima falhar (use-o na regra de protecao do branch).
  all-green:
    runs-on: ubuntu-latest
    needs: [backend, qmagery]
    if: always()
    steps:
      - name: Verifica se todos os jobs passaram
        run: |
          if [[ "${{ needs.backend.result }}" != "success" || "${{ needs.qmagery.result }}" != "success" ]]; then
            echo "FALHA: backend=${{ needs.backend.result }} qmagery=${{ needs.qmagery.result }}"
            exit 1
          fi
          echo "Todos os jobs passaram."
